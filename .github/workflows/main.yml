name: Scrape Bangchak Oil Price Data

on:
  schedule:
    # 10:10 UTC และ 12:10 UTC = ตรงกับ 17:10 น. และ 19:10 น. (เวลาไทย)
    - cron: '10 10,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright requests beautifulsoup4 lxml
          playwright install --with-deps chromium

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push updated JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add oil_price.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update oil price data" && git push)
