name: Scrape Bangchak Oil Price Data

on:
  schedule:
    # รันอัตโนมัติทุกวัน เวลา 05:05 น. (เวลาไทย คือ 22:05 UTC)
    - cron: '05 22 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright requests beautifulsoup4 lxml
          playwright install --with-deps chromium

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push updated JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add oil_price.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update oil price data" && git push)
