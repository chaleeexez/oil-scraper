name: Scrape Bangchak Oil Price Data

on:
  schedule:
    # รันวันละ 2 รอบ: 07:05 น. และ 17:30 น. (เวลาไทย)
    # 00:05 UTC = 07:05 น. ไทย / 10:30 UTC = 17:30 น. ไทย
    - cron: '05 0,10 * * *'
  workflow_dispatch:

# เพิ่มสิทธิ์ให้ Bot สามารถ Write/Push ข้อมูลกลับลง Repo ได้
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright requests beautifulsoup4 lxml
          playwright install --with-deps chromium

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push updated JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add oil_price.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update oil price data" && git push)
